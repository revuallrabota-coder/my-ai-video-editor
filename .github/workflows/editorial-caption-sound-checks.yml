name: "🔊 Проверка звуков всплывающих субтитров"

on:
  push:
    paths:
      - "editorial_caption_sfx.py"
      - "reels_effects.py"
      - "index.html"
      - "test_editorial_caption_sfx.py"
      - "test_smart_sound_design.py"
      - ".github/workflows/editorial-caption-sound-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caption-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install "Pillow>=10,<13" "telethon>=1.40,<2" "requests>=2.31,<3"
      - name: Compile original SFX generator and render logic
        run: python -m py_compile editorial_caption_sfx.py reels_effects.py test_editorial_caption_sfx.py
      - name: Verify individual sound types, exact phrase timing, and actual MP4 audio
        run: python -m unittest -v test_editorial_caption_sfx.py test_smart_sound_design.py
