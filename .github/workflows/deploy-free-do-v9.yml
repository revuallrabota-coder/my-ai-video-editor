name: "🚀 Deploy бесплатный Worker v9 (без R2)"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare_launcher_do_v9.js'
      - 'wrangler.do.v9.toml.template'
      - 'test_upload_3gb_do.mjs'
      - '.github/workflows/deploy-free-do-v9.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-free-do-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check credentials are configured without printing them
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_UPLOADS_KV_ID: ${{ secrets.CLOUDFLARE_UPLOADS_KV_ID }}
        run: |
          python - <<'PY'
          import os,re
          for key in ("CLOUDFLARE_ACCOUNT_ID","CLOUDFLARE_API_TOKEN","CLOUDFLARE_UPLOADS_KV_ID"):
              if not os.environ.get(key):
                  raise SystemExit("Missing GitHub Actions secret: "+key)
          if not re.fullmatch(r"[a-fA-F0-9]{32}",os.environ["CLOUDFLARE_UPLOADS_KV_ID"]):
              raise SystemExit("CLOUDFLARE_UPLOADS_KV_ID must be the 32-hex-character KV namespace ID")
          print("Cloudflare deployment secrets are configured.")
          PY
      - name: Assemble private binding configuration
        env:
          CLOUDFLARE_UPLOADS_KV_ID: ${{ secrets.CLOUDFLARE_UPLOADS_KV_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          template=Path("wrangler.do.v9.toml.template").read_text("utf-8")
          config=template.replace("__EXISTING_UPLOADS_KV_NAMESPACE_ID__",
                                  os.environ["CLOUDFLARE_UPLOADS_KV_ID"])
          Path("wrangler.do.v9.generated.toml").write_text(config,"utf-8")
          PY
      - name: Verify syntax and SQLite shard class
        run: |
          node --input-type=module --check < cloudflare_launcher_do_v9.js
          grep -q 'new_sqlite_classes = \["VideoChunkShard"\]' wrangler.do.v9.generated.toml
      - name: Test Worker storage and signed downloads before deployment
        run: node test_upload_3gb_do.mjs
      - name: Compile Worker before deployment
        run: npx --yes wrangler@4 deploy --config wrangler.do.v9.generated.toml --dry-run --outdir /tmp/worker-v9-dry
      - name: Deploy v9 to EXISTING black-violet-9e64 Worker without deleting secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config wrangler.do.v9.generated.toml --keep-vars
      - name: Verify deployed Worker health
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 5 https://black-violet-9e64.revuall-rabota.workers.dev/health -o /tmp/worker-health.json
          python - <<'PY'
          import json
          with open('/tmp/worker-health.json') as f:
              h=json.load(f)
          for k,v in {'style_contract_version':9,'durable_storage_configured':True,'storage_mode':'do','max_upload_mb':3000,'max_video_seconds':600}.items():
              if h.get(k)!=v:
                  raise SystemExit('Unexpected health field: '+k)
          print('Worker v9 health checks passed.')
          PY
