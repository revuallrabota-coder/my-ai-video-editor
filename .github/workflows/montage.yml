name: "🎬 Монтаж через Telegram"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Как обработать ролик?"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - captions
          - cuts
      color:
        description: "Цвет выделенных слов, например #EBC0C8"
        required: true
        default: "#EBC0C8"
        type: string

      subtitle_style:
        description: "Субтитры по референсу или старые"
        required: true
        default: signature
        type: choice
        options:
          - signature
          - classic
      hook_text:
        description: "Заголовок вверху первые 5 секунд (необязательно)"
        required: false
        default: ""
        type: string
      audio_profile:
        description: "Звук: очистка от шума и ровная громкость"
        required: true
        default: balanced
        type: choice
        options:
          - balanced
          - strong
          - off

concurrency:
  group: telegram-video-montage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  montage:
    name: "🎞️ Дождаться видео и смонтировать"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: "Загрузить код"
        uses: actions/checkout@v4

      - name: "Установить Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Установить FFmpeg и кириллические шрифты"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: "Установить бесплатные библиотеки"
        run: python -m pip install -r requirements.txt

      - name: "Проверить синтаксис"
        run: python -m py_compile telegram_editor.py

      - name: "Ожидать видео и обработать"
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          MONTAGE_MODE: ${{ inputs.mode }}
          SUBTITLE_COLOR: ${{ inputs.color }}
          AUDIO_PROFILE: ${{ inputs.audio_profile }}
          SUBTITLE_STYLE: ${{ inputs.subtitle_style }}
          HOOK_TEXT: ${{ inputs.hook_text }}
        run: python telegram_editor.py
