name: "🧪 Тест монтажа без API ID"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим обработки"
        required: true
        default: my_style
        type: choice
        options:
          - my_style
          - auto
          - captions
          - cuts
          - reference
      color:
        description: "Цвет: auto (по стилю) или #RRGGBB"
        required: true
        default: "auto"
        type: string

      subtitle_style:
        description: "Оформление + анимация: слова отдельно или фразы"
        required: true
        default: reference_dynamic
        type: choice
        options:
          - reference_dynamic
          - signature
          - contrast
          - classic
          - signature_phrases
          - contrast_phrases
          - classic_phrases
      hook_text:
        description: "Заголовок вверху первые 5 секунд (необязательно)"
        required: false
        default: ""
        type: string
      camera_style:
        description: "Приближение: монтажные планы или прежний зум"
        required: true
        default: cinematic_pan
        type: choice
        options:
          - cinematic_pan
          - editorial
          - enhanced
          - soft_punch
          - gentle
          - "off"
      video_speed:
        description: "Скорость видео, включая речь"
        required: true
        default: "1.0"
        type: choice
        options:
          - "1.0"
          - "1.1"
          - "1.2"
      video_filter:
        description: "Цветокоррекция"
        required: true
        default: none
        type: choice
        options:
          - warm
          - none
      caption_position:
        description: "Расположение субтитров"
        required: true
        default: middle
        type: choice
        options:
          - top
          - middle
          - bottom
      font_profile:
        description: "Шрифт акцентных слов"
        required: true
        default: elegant
        type: choice
        options:
          - elegant
          - clean
          - bold
          - bebas
          - platform
          - bubble
          - script
          - modern
      audio_profile:
        description: "Звук: очистка от шума и ровная громкость"
        required: true
        default: balanced
        type: choice
        options:
          - balanced
          - strong
          - off

concurrency:
  group: telegram-video-montage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-montage:
    name: "🎞️ Монтаж через обычного Telegram-бота"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: "Получить код"
        uses: actions/checkout@v4

      - name: "Установить Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Установить FFmpeg"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-color-emoji fonts-lato fonts-comfortaa fonts-lobstertwo

      - name: "Установить зависимости"
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "requests>=2.31,<3"

      - name: "Проверить синтаксис"
        run: python -m py_compile bot_api_editor.py telegram_editor.py reference_editor.py signature_captions.py contrast_captions.py word_captions.py speech_review.py reels_effects.py font_presets.py export_profiles.py reference_dynamic_captions.py

      - name: "Запустить тестовый монтаж"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          MONTAGE_MODE: ${{ inputs.mode }}
          SUBTITLE_COLOR: ${{ inputs.color }}
          AUDIO_PROFILE: ${{ inputs.audio_profile }}
          SUBTITLE_STYLE: ${{ inputs.subtitle_style }}
          CAMERA_STYLE: ${{ inputs.camera_style }}
          VIDEO_SPEED: ${{ inputs.video_speed }}
          VIDEO_FILTER: ${{ inputs.video_filter }}
          CAPTION_POSITION: ${{ inputs.caption_position }}
          FONT_PROFILE: ${{ inputs.font_profile }}
          EXPORT_QUALITY: high
          HOOK_TEXT: ${{ inputs.hook_text }}
        run: python bot_api_editor.py
