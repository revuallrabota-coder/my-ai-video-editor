name: "✅ Проверка кода монтажёра"

on:
  push:
    branches: [main]
    paths:
      - "reference_editor.py"
      - "index.html"
      - "video_filters.py"
      - "test_reels_looks.py"
      - "test_caption_safe_area.py"
      - "test_gentle_reference.py"
      - "top_video_title.py"
      - "test_oval_title.py"
      - "telegram_editor.py"
      - "bot_api_editor.py"
      - "speech_review.py"
      - "test_speech_review.py"
      - "word_captions.py"
      - "font_presets.py"
      - "test_font_presets.py"
      - "editor_api.py"
      - "requirements-api.txt"
      - "test_editor_api.py"
      - "export_profiles.py"
      - "reference_dynamic_captions.py"
      - "test_reference_motion.py"
      - "process_uploaded_video.py"
      - "montage_progress.py"
      - "test_montage_progress.py"
      - "cloudflare_launcher.js"
      - "test_upload_500mb.mjs"
      - "clip_montage.py"
      - "test_clip_montage.py"
      - "CLOUDFLARE_500MB.md"
      - "CLOUDFLARE_300MB.md"
      - ".github/workflows/upload-video-50mb.yml"
      - "CLOUDFLARE_50MB.md"
      - "Dockerfile"
      - "render.yaml"
      - "test_word_captions.py"
      - "reels_effects.py"
      - "retro_inserts.py"
      - "reference_motion_scenes.py"
      - "semantic_editing.py"
      - "private_effect_assets.py"
      - "test_semantic_editing.py"
      - "test_retro_inserts.py"
      - "test_reels_effects.py"
      - "test_audio_pipeline.py"
      - "signature_captions.py"
      - "test_signature_captions.py"
      - "contrast_captions.py"
      - "test_contrast_captions.py"
      - ".github/workflows/test-without-api-id.yml"
      - ".github/workflows/check-editor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Шрифт для крупного розового курсива"
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core fonts-noto-color-emoji fonts-lato fonts-comfortaa fonts-roboto fonts-open-sans fonts-noto-core fonts-ubuntu fonts-crosextra-carlito
      - name: "Зависимости для проверки"
        run: python -m pip install "telethon>=1.40,<2" "requests>=2.31,<3" "Pillow>=10,<13" -r requirements-api.txt
      - name: "Проверить синтаксис Python"
        run: python -m py_compile clip_montage.py test_clip_montage.py bot_api_editor.py telegram_editor.py reference_editor.py signature_captions.py contrast_captions.py speech_review.py word_captions.py reels_effects.py font_presets.py editor_api.py export_profiles.py reference_dynamic_captions.py process_uploaded_video.py video_filters.py test_reels_looks.py test_caption_safe_area.py retro_inserts.py reference_motion_scenes.py semantic_editing.py private_effect_assets.py test_semantic_editing.py montage_progress.py test_montage_progress.py test_retro_inserts.py test_gentle_reference.py top_video_title.py test_oval_title.py
      - name: "Проверить синтаксис Cloudflare Worker"
        run: node --input-type=module --check < cloudflare_launcher.js

      - name: "Проверить частные обновления статуса без остановки рендера"
        run: python -m unittest -v test_montage_progress.py

      - name: "Протестировать многоклиповый проект 500 МБ и 126 частей без роста памяти"
        run: node test_upload_500mb.mjs

      - name: "Проверить JS экрана iPad с несколькими видео"
        run: node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const i=h.indexOf('<script>');const j=h.indexOf('</script>',i);if(i<0||j<=i)throw Error('Missing app script');new Function(h.slice(i+8,j));"

      - name: "Проверить склейку исходников, тишину и порядок кадров через FFmpeg"
        run: python -m unittest -v test_clip_montage.py

      - name: "Проверить правки распознавания и зум по фразам"
        run: python -m unittest -v test_speech_review.py

      - name: "Проверить авторизацию Telegram и безопасные настройки API"
        run: python -m unittest -v test_editor_api.py

      - name: "Проверить боковой Zoom, плавающий текст и Full HD"
        run: python -m unittest -v test_reference_motion.py

      - name: "Проверить звук, эмодзи и хук в настоящем FFmpeg"
        run: python -m unittest -v test_reels_effects.py

      - name: "Проверить смысловой монтаж и приватные иконки MOV в реальном MP4"
        run: python -m unittest -v test_semantic_editing.py

      - name: "Проверить винтажные карточки, звуки камеры и вставки в реальном видео"
        run: python -m unittest -v test_retro_inserts.py

      - name: "Проверить новые стили Old Money, Vintage, Street и Elegant"
        run: python -m unittest -v test_reels_looks.py

      - name: "Реально проверить через FFmpeg, что длинные слова и подложки не обрезаются"
        run: python -m unittest -v test_caption_safe_area.py

      - name: "Проверить настоящие овальные тени и выбранное пользователем название в реальном Reels"
        run: python -m unittest -v test_oval_title.py

      - name: "Проверить нежные цельные фразы и эмодзи рядом с текстом"
        run: python -m unittest -v test_gentle_reference.py

      - name: "Проверить 19 шрифтов с русской кириллицей"
        run: python -m unittest -v test_font_presets.py

      - name: "Проверить анимацию одного слова и рендер"
        run: python -m unittest -v test_word_captions.py

      - name: "Проверить красные акценты и белые подписи"
        run: python -m unittest -v test_contrast_captions.py

      - name: "Проверить всплывающие розовые субтитры"
        run: python -m unittest -v test_signature_captions.py

      - name: "Проверить три режима улучшения звука"
        run: python -m unittest -v test_audio_pipeline.py

      - name: "Проверить приближения на тестовом видео"
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile
          from reference_editor import analyze_reference, add_virtual_camera
          from telegram_editor import duration_and_audio

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              source, ready = root / "source.mp4", root / "ready.mp4"
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                  "-f", "lavfi", "-i", "testsrc2=size=360x640:rate=30:duration=2",
                  "-f", "lavfi", "-i", "sine=frequency=400:duration=2",
                  "-c:v", "libx264", "-preset", "ultrafast", "-c:a", "aac",
                  "-shortest", str(source),
              ], check=True)
              profile = analyze_reference(source)
              assert 0.9 <= profile.seconds_per_change <= 4.5
              for camera_style in ("off", "gentle", "soft_punch", "enhanced", "editorial", "cinematic_pan"):
                  add_virtual_camera(source, ready, profile.seconds_per_change, camera_style=camera_style, quality="balanced")
                  duration, has_audio = duration_and_audio(ready)
                  assert 1.7 < duration < 2.3
                  assert has_audio
              print("✓ FFmpeg референсный монтаж: тест пройден")
          PY
